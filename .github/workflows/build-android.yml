
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Chuma3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chuma3D-Android-APK
          path: build/Chuma3D.apk
